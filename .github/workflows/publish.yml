name: Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
    docker_build_and_push_to_dockerhub:
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout
            uses: actions/checkout@v4
        -   name: Set up QEMU
            uses: docker/setup-qemu-action@v3
        -   name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
        -   name: Login to DockerHub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
        -   name: Build and push
            uses: docker/build-push-action@v6
            with:
                push: true
                platforms: linux/amd64,linux/arm64/v8
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/pisa-lite:${{ github.ref_name }}
                    ${{ secrets.DOCKER_USERNAME }}/pisa-lite:latest

    docker_build_and_push_to_gitlab:
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout
            uses: actions/checkout@v4

        -   name: Login to GitLab Container Registry
            run: echo ${{ secrets.REGISTRY_PASSWORD }} | docker login -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin ${{ vars.REGISTRY_URL }}

        -   name: Build and tag Docker image
            run: docker build -t ${{ vars.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/packages/pisa:latest .

        -   name: Push Docker image to GitLab Container Registry
            run: docker push ${{ vars.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/packages/pisa:latest
